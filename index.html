<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // 1. Set your final destination URL
        const targetUrl = "https://youtube.com";
        
        // 2. Detect the environment
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInstagram = /Instagram|FBAN|FBAV/i.test(ua);
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPhone|iPad|iPod/i.test(ua);

        if (isInstagram) {
            if (isAndroid) {
                // ANDROID: Strip https:// and use Android Intent
                const strippedUrl = targetUrl.replace(/^https?:\/\//, "");
                const intentUrl = `intent://${strippedUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
                window.location.replace(intentUrl);
            } 
            else if (isIOS) {
                // IOS: Replace https:// with the Safari custom scheme
                const safariUrl = targetUrl.replace(/^https:\/\//i, "x-safari-https://").replace(/^http:\/\//i, "x-safari-http://");
                window.location.replace(safariUrl);
            }
        } else {
            // NOT INSTAGRAM: Normal browser, standard redirect
            window.location.replace(targetUrl);
        }
    </script>
</head>
<body style="background-color: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <!-- Minimal fallback UI just in case a future OS update blocks the scheme -->
    <h2>Opening securely in your browser...</h2>
</body>
</html>
