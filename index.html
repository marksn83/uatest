
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Opening Link...</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --accent: #38bdf8;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 24px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            position: relative;
        }
        .indicator-arrow {
            position: absolute;
            top: -45px;
            right: 15px;
            font-size: 32px;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        h2 {
            margin: 0 0 12px;
            font-size: 1.25rem;
            color: #ffffff;
        }
        p {
            margin: 0 0 20px;
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
        }
        .step-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: 1px solid #334155;
            text-align: left;
        }
        .step-box ol {
            margin: 0;
            padding-left: 20px;
        }
        .step-box li {
            margin-bottom: 6px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .btn-primary {
            background-color: var(--accent);
            color: #0f172a;
            margin-bottom: 10px;
        }
        .btn-secondary {
            background-color: #334155;
            color: #ffffff;
        }
        .btn:active {
            opacity: 0.8;
        }
        #ios-guide {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="ios-guide">
        <div class="indicator-arrow">↗️</div>
        <h2>Open in Safari</h2>
        <p>Instagram limits page features inside its app. To access the full website, switch to your system browser:</p>
        
        <div class="step-box">
            <ol>
                <li>Tap the <strong>three dots (•••)</strong> in the top-right corner.</li>
                <li>Select <strong>Open in External Browser</strong> or <strong>Open in Safari</strong>.</li>
            </ol>
        </div>

        <button class="btn btn-primary" onclick="copyDestination()">Copy Link</button>
        <a class="btn btn-secondary" id="direct-link" href="#">Continue Here Anyway</a>
    </div>

    <script>
        // CONFIGURATION: Set your destination link here
        const targetUrl = "https://your-actual-destination.com";
        document.getElementById("direct-link").href = targetUrl;

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInstagram = /Instagram|FBAN|FBAV/i.test(ua);
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPhone|iPad|iPod/i.test(ua);

        function copyDestination() {
            navigator.clipboard.writeText(targetUrl).then(() => {
                alert("Link copied! Paste it into Safari.");
            }).catch(() => {
                prompt("Copy this link and open it in Safari:", targetUrl);
            });
        }

        if (isInstagram) {
            if (isAndroid) {
                // ANDROID: Strip protocol and redirect via Android Intent URL scheme
                const strippedUrl = targetUrl.replace(/^https?:\/\//, "");
                const intentUrl = `intent://${strippedUrl}#Intent;scheme=https;action=android.intent.action.VIEW;end;`;
                window.location.replace(intentUrl);
            } else if (isIOS) {
                // iOS: Unhide the UI instruction card pointing to the native top menu
                document.getElementById("ios-guide").style.display = "block";
            }
        } else {
            // Already in a standard desktop or mobile browser -> Redirect immediately
            window.location.replace(targetUrl);
        }
    </script>
</body>
</html>
